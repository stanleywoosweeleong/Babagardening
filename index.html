<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baba 园艺产品目录 2026 · 互动版</title>
<meta name="theme-color" content="#0B6B45">
<meta name="description" content="Baba Gardening Catalogue 2026 (REV/MAY) — interactive offline catalogue">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baba 目录">
<meta name="application-name" content="Baba 目录">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --paper:#F4F3EF; --card:#FFFFFF; --ink:#14211B; --ink-2:#4A5952;
  --green:#0B6B45; --green-d:#063A26; --green-l:#E7F0EA;
  --cotta:#C1552C; --cotta-t:#A0401D; --cotta-l:#F7E9E2;
  --field:#DEE0DD; --kraft:#D9C9A8;
  --line:rgba(20,33,27,.14); --line-s:rgba(20,33,27,.07);
  --warn:#9A6207; --warn-bg:#FDF3DF;
  --display:"Avenir Next","Segoe UI Variable Display",Corbel,"Trebuchet MS",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Courier New",monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:1rem;line-height:1.5;overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(20,33,27,.2);border-radius:8px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:60;background:var(--green);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;
}
.brandrow{display:flex;align-items:center;gap:10px}
.mark{
  /* Green wordmark on a white plate — as it appears on the catalogue cover. */
  height:2.25rem;width:auto;flex:none;display:block;
  background:#fff;border-radius:7px;padding:6px 10px;box-sizing:content-box;
}
.brandtxt{flex:1;min-width:0}
.brandtxt b{display:block;font-family:var(--display);font-size:1rem;font-weight:600;letter-spacing:.01em}
.brandtxt span{display:block;font-size:0.75rem;opacity:.85;font-family:var(--mono);letter-spacing:.04em}
.langbtn{
  flex:none;border:1px solid rgba(255,255,255,.45);border-radius:999px;
  padding:5px 12px;font-size:0.875rem;font-weight:700;letter-spacing:.06em;font-family:var(--mono);
}
.langbtn:active{background:rgba(255,255,255,.16)}
nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:1 0 auto;padding:9px 14px 10px;font-size:1rem;font-weight:600;
  color:#D6E7DE;border-bottom:3px solid transparent;white-space:nowrap;
}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--cotta)}

main{padding:0 0 calc(28px + var(--safe-b))}
.pane{display:none;animation:fade .18s ease}
.pane.on{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}

/* ---------- search + filters ---------- */
.searchbar{position:sticky;top:0;z-index:40;background:var(--paper);padding:12px 14px 8px;
  box-shadow:0 6px 12px -12px rgba(0,0,0,.5)}
.searchbar .inner{max-width:1180px;margin:0 auto;position:relative}
.searchbar input{
  width:100%;padding:11px 40px 11px 38px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-size:1.0625rem;outline:none
}
.searchbar input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}
.si{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55;font-size:1.0625rem}
.clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 10px;opacity:.62;font-size:1.25rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:0.9375rem;font-weight:600;color:var(--ink-2);white-space:nowrap
}
.chip .n{font-weight:600;font-family:var(--mono);opacity:.5;font-size:0.8125rem;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.chip[aria-pressed="true"] .n{opacity:.7}

/* ---------- product grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;padding:4px 0 6px}
.pcard{
  background:var(--card);border:1px solid var(--line-s);border-radius:12px;overflow:hidden;
  text-align:left;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s
}
.pcard:active{transform:scale(.978)}
@media(hover:hover){.pcard:hover{box-shadow:0 4px 16px -6px rgba(20,33,27,.22)}}
.pcard:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.thumb{aspect-ratio:1/1;position:relative;overflow:hidden;background:var(--field)}
.badge{
  position:absolute;top:6px;left:6px;background:var(--cotta);color:#fff;font-size:0.6875rem;
  font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:3px;font-family:var(--mono)
}
.pbody{padding:8px 9px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.pname{font-size:1rem;font-weight:600;line-height:1.28}
.palt{font-weight:500;font-size:0.875rem;color:var(--ink-2);line-height:1.25}
.pcode{font-weight:600;font-family:var(--mono);font-size:0.875rem;color:var(--cotta-t);letter-spacing:.02em;margin-top:2px}
.dots{display:flex;gap:3px;margin-top:auto;padding-top:6px}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(20,33,27,.22)}
.empty{font-size:1rem;padding:52px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--display);font-size:1.1875rem;color:var(--ink);margin-bottom:4px}
.count{font-weight:500;font-family:var(--mono);font-size:0.875rem;color:var(--ink-2);padding:2px 0 8px;letter-spacing:.03em}

/* ---------- section head ---------- */
.shead{font-family:var(--display);font-size:1.3125rem;font-weight:600;margin:20px 0 4px;letter-spacing:-.01em}
.ssub{font-size:0.9375rem;color:var(--ink-2);margin-bottom:12px}

/* ---------- spec strip (the catalogue motif) ---------- */
.strip{background:var(--field);border-radius:10px;padding:11px 13px;margin:10px 0}
.strip table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:0.9375rem}
.strip th{
  text-align:left;font-weight:600;font-size:0.8125rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-2);border-bottom:1px solid rgba(20,33,27,.35);padding:0 8px 4px 0;font-family:var(--body)
}
.strip td{padding:5px 8px 4px 0;border-bottom:1px solid rgba(20,33,27,.09);vertical-align:middle}
.strip tr:last-child td{border-bottom:0}
.slink{font-size:0.9375rem;color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:2px;font-family:var(--mono)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:95;background:var(--paper);
  border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(24px + var(--safe-b));box-shadow:0 -8px 40px rgba(0,0,0,.25)
}
.sheet.on{transform:translateY(0)}
@media(min-width:760px){.sheet{max-width:640px;margin:0 auto;border-radius:18px;bottom:16px;left:16px;right:16px;max-height:88vh}}
.sgrab{position:sticky;top:0;background:var(--paper);padding:9px 0 5px;text-align:center;z-index:2;border-radius:18px 18px 0 0}
.sgrab i{display:inline-block;width:38px;height:4px;border-radius:4px;background:rgba(20,33,27,.22)}
.sclose{position:absolute;right:10px;top:8px;padding:6px 11px;font-size:1.375rem;color:var(--ink-2)}
.sbody{padding:2px 18px 0}
.shero{display:flex;gap:14px;align-items:flex-start}
.shero .thumb{width:118px;flex:none;border-radius:10px;border:1px solid var(--line-s)}
.stitle{font-family:var(--display);font-size:1.375rem;font-weight:600;line-height:1.18;letter-spacing:-.01em}
.salt{font-size:0.9375rem;color:var(--ink-2);margin-top:3px;line-height:1.3}
.sser{font-weight:600;display:inline-block;font-size:0.8125rem;font-family:var(--mono);background:var(--green-l);color:var(--green-d);
  padding:2px 7px;border-radius:4px;margin-top:7px;letter-spacing:.02em}
.sdesc{margin:14px 0 0;font-size:1.0625rem;line-height:1.55}
.sdesc small{display:block;color:var(--ink-2);font-size:0.9375rem;margin-top:3px}
.lbl{font-size:0.8125rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:20px 0 7px}
.packs{display:flex;flex-direction:column;gap:6px}
.pack{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px
}
.pack .code{font-family:var(--mono);font-size:0.9375rem;color:var(--cotta);font-weight:700;flex:none;min-width:74px}
.pack .size{flex:1;font-size:1rem}
.add{
  flex:none;background:var(--green);color:#fff;border-radius:8px;padding:6px 13px;
  font-size:0.9375rem;font-weight:700
}
.add:active{background:var(--green-d)}
.add.in{background:var(--cotta)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:flex;align-items:center;gap:6px;font-size:0.9375rem;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 5px}
.sw i{width:15px;height:15px;border-radius:50%;border:1px solid rgba(20,33,27,.25);display:block}
.reflist{display:flex;flex-wrap:wrap;gap:6px}
.ref{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;
  font-family:var(--mono);font-size:0.9375rem}
.ref.hit{border-color:var(--green);color:var(--green-d);font-weight:600}
.ref.miss{color:var(--ink-2);border-style:dashed}
.note{background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;
  padding:10px 12px;font-size:0.9375rem;line-height:1.5;color:#5A4204;margin-top:16px}
.note b{display:block;margin-bottom:3px;color:var(--warn)}
.pagebtn{
  display:block;width:100%;margin-top:18px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:12px;font-size:1rem;font-weight:600;color:var(--green-d);text-align:center
}

/* ---------- match tools ---------- */
.seg{display:flex;gap:4px;background:var(--field);border-radius:10px;padding:4px;margin:14px 0}
.seg button{flex:1;padding:8px 6px;border-radius:7px;font-size:0.9375rem;font-weight:600;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tool{display:none}.tool.on{display:block}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.filters label{flex:1;min-width:132px;font-size:0.8125rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-2)}
.filters input,.filters select{
  display:block;width:100%;margin-top:4px;padding:9px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);font-size:1rem;font-family:var(--mono)
}
.mtable{width:100%;border-collapse:collapse;font-size:0.9375rem;background:var(--card);
  border-radius:10px;overflow:hidden;border:1px solid var(--line-s)}
.mtable th{background:var(--field);text-align:left;font-size:0.8125rem;letter-spacing:.07em;
  text-transform:uppercase;padding:8px 9px;color:var(--ink-2);font-weight:700;white-space:nowrap}
.mtable td{padding:8px 9px;border-top:1px solid var(--line-s);vertical-align:middle}
.mtable td.m{font-family:var(--mono);font-size:0.9375rem;white-space:nowrap}
.mtable tr:active{background:var(--green-l)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.saucard{background:var(--card);border:1px solid var(--line-s);border-radius:11px;padding:12px 13px;margin-bottom:9px}
.saurow{display:flex;align-items:baseline;gap:10px}
.saucode{font-family:var(--mono);font-size:1.25rem;font-weight:700;color:var(--cotta-t)}
.saudim{font-family:var(--mono);font-size:0.9375rem;color:var(--ink-2)}
.saupots{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.pill{font-weight:500;background:var(--green-l);color:var(--green-d);border-radius:6px;padding:3px 8px;
  font-family:var(--mono);font-size:0.875rem}
.standcard{display:flex;gap:12px;background:var(--card);border:1px solid var(--line-s);
  border-radius:11px;padding:11px 12px;margin-bottom:9px;text-align:left;width:100%}
.standcard .thumb{width:74px;height:74px;flex:none;border-radius:8px;aspect-ratio:auto}

/* ---------- list ---------- */
.litem{display:flex;gap:11px;background:var(--card);border:1px solid var(--line-s);
  border-radius:11px;padding:10px 11px;margin-bottom:9px;align-items:center}
.litem .thumb{width:52px;height:52px;flex:none;border-radius:7px;aspect-ratio:auto}
.linfo{flex:1;min-width:0}
.linfo b{display:block;font-size:1rem;font-weight:600;line-height:1.25}
.linfo span{font-weight:500;display:block;font-family:var(--mono);font-size:0.875rem;color:var(--cotta);margin-top:2px}
.qty{display:flex;align-items:center;gap:2px;flex:none}
.qty button{width:29px;height:29px;border-radius:7px;background:var(--field);font-size:1.125rem;
  font-weight:700;color:var(--ink-2);line-height:1}
.qty input{width:38px;text-align:center;border:0;background:none;font-family:var(--mono);
  font-size:1rem;font-weight:700;padding:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
.btn{flex:1;min-width:130px;padding:12px;border-radius:10px;font-size:1rem;font-weight:600;text-align:center}
.btn.pri{background:var(--green);color:#fff}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.dgr{background:none;border:1px solid var(--line);color:#A03328}

/* ---------- pages ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;padding:6px 0}
.pgt{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);display:block}
.pgt img{width:100%;display:block;aspect-ratio:595/842;object-fit:cover;object-position:top}
.pgt span{display:block;font-family:var(--mono);font-size:0.8125rem;padding:4px 6px;color:var(--ink-2);text-align:center}
.viewer{position:fixed;inset:0;background:#12160F;z-index:110;display:none;flex-direction:column}
.viewer.on{display:flex}
.vtop{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;
  color:#fff;background:rgba(0,0,0,.35)}
.vtop b{flex:1;font-family:var(--mono);font-size:0.9375rem;font-weight:500}
.vtop button{color:#fff;padding:6px 12px;border:1px solid rgba(255,255,255,.3);border-radius:8px;font-size:1rem}
.vscroll{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:8px}
.vscroll img{max-width:100%;height:auto;border-radius:4px}

/* ---------- share ---------- */
.qrcard{background:var(--card);border:1px solid var(--line-s);border-radius:16px;
  padding:20px;text-align:center;max-width:400px;margin:6px auto 0}
.qrcard img{width:100%;max-width:290px;height:auto;display:block;margin:0 auto;
  border-radius:10px}
.qrurl{font-family:var(--mono);font-size:.8125rem;color:var(--ink-2);word-break:break-all;
  margin-top:14px;line-height:1.45}
.sharebtns{display:flex;flex-wrap:wrap;gap:8px;max-width:400px;margin:14px auto 0}
.sharebtns button{flex:1 1 46%;min-height:46px;border-radius:10px;font-size:1rem;
  font-weight:600;padding:12px 10px}
.sb-pri{background:var(--green);color:#fff}
.sb-sec{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.howto{max-width:640px;margin:26px auto 0}
.how{background:var(--card);border:1px solid var(--line-s);border-radius:12px;
  padding:14px 16px;margin-bottom:10px}
.how h4{margin:0 0 6px;font-family:var(--display);font-size:1.0625rem;font-weight:600;
  color:var(--green-d)}
.how ol{margin:0;padding-left:20px;font-size:.9375rem;line-height:1.65;color:var(--ink-2)}
.how li{margin-bottom:3px}
.how .warn{display:block;margin-top:8px;background:var(--warn-bg);border-left:3px solid var(--warn);
  border-radius:0 6px 6px 0;padding:8px 10px;font-size:.875rem;color:#5A4204;line-height:1.5}
.installbox{max-width:400px;margin:14px auto 0}
.installbtn{width:100%;min-height:52px;border-radius:12px;background:var(--green);color:#fff;
  font-size:1.0625rem;font-weight:700;display:none;align-items:center;justify-content:center;gap:8px}
.installbtn.on{display:flex}
.installed{display:none;text-align:center;background:var(--green-l);color:var(--green-d);
  border-radius:10px;padding:12px;font-size:.9375rem;font-weight:600}
.installed.on{display:block}
.diag{max-width:400px;margin:12px auto 0;font-size:.875rem}
.diag summary{cursor:pointer;color:var(--ink-2);padding:8px 0;font-weight:600}
.diag ul{list-style:none;margin:6px 0 0;padding:12px 14px;background:var(--card);
  border:1px solid var(--line-s);border-radius:10px}
.diag li{display:flex;gap:9px;align-items:flex-start;padding:5px 0;line-height:1.45}
.diag li i{font-style:normal;flex:none;font-weight:700}
.diag li.y i{color:var(--green)}
.diag li.n i{color:#A03328}
.diag li.i i{color:var(--ink-2)}
.diag li.i span{color:var(--ink-2)}
.diag .hint{margin-top:8px;padding-top:9px;border-top:1px solid var(--line-s);color:var(--ink-2);
  font-size:.8125rem;line-height:1.5}
/* ---------- toast / about ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,20px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:1rem;
  z-index:200;opacity:0;pointer-events:none;transition:.22s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.about{font-size:1rem;line-height:1.62;color:var(--ink-2);max-width:640px}
.about h3{font-family:var(--display);color:var(--ink);font-size:1.0625rem;margin:20px 0 6px}
.about code{font-family:var(--mono);font-size:0.875rem;background:var(--field);padding:1px 5px;border-radius:4px}
.about a{color:var(--green)}
.update{
  position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));z-index:210;
  background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;
  display:none;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.3)
}
.update.on{display:flex}
.update span{flex:1;font-size:.9375rem;line-height:1.4}
.update button{background:#fff;color:var(--ink);border-radius:8px;padding:9px 14px;
  font-size:.9375rem;font-weight:700;min-height:40px;flex:none}
@media(min-width:620px){.update{max-width:520px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* --- mobile ergonomics: 44px minimum touch targets --- */
html{font-size:100%;-webkit-text-size-adjust:100%}
nav button{min-height:44px}
.langbtn,.sizebtn{min-height:38px;display:inline-flex;align-items:center;justify-content:center}
.chip{min-height:38px;display:inline-flex;align-items:center}
.add{min-height:40px;display:inline-flex;align-items:center}
.qty button{width:40px;height:40px}
.sclose,.clr{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.vtop button{min-height:44px;min-width:44px}
.seg button{min-height:42px}
.pgt span{padding:7px 6px}

<body>

<header>
  <div class="brandrow">
    <img class="mark" id="brandMark" alt="Baba" src="">
    <div class="brandtxt">
      <b id="hTitle">园艺产品目录 2026</b>
      <span>REV / MAY · KEAN BENG LEE INDUSTRIES</span>
    </div>
    <div class="hdrbtns"><button class="sizebtn" id="sizeBtn" aria-label="Text size">A<sup>+</sup></button><button class="langbtn" id="langBtn">EN</button></div>
  </div>
  <nav id="tabs" role="tablist"></nav>
</header>

<main>
  <!-- BROWSE -->
  <section class="pane on" id="pane-browse">
    <div class="searchbar">
      <div class="inner">
        <span class="si">⌕</span>
        <input id="q" type="search" autocomplete="off" placeholder="搜索名称、货号、包装…">
        <button class="clr" id="qClear" hidden>×</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="wrap">
      <div class="count" id="count"></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
    </div>
  </section>

  <!-- MATCH -->
  <section class="pane" id="pane-match">
    <div class="wrap">
      <div class="shead" id="mHead">配对工具</div>
      <div class="ssub" id="mSub"></div>
      <div class="seg" id="mSeg"></div>

      <div class="tool on" id="tool-pot">
        <div class="filters">
          <label id="lbDiaMin">Ø 最小 <input type="number" id="fDiaMin" inputmode="numeric" placeholder="0"></label>
          <label id="lbDiaMax">Ø 最大 <input type="number" id="fDiaMax" inputmode="numeric" placeholder="9999"></label>
          <label id="lbHtMax">高度 最大 <input type="number" id="fHtMax" inputmode="numeric" placeholder="9999"></label>
        </div>
        <div class="tscroll"><table class="mtable" id="potTable"></table></div>
      </div>

      <div class="tool" id="tool-saucer"><div id="saucerList"></div></div>
      <div class="tool" id="tool-stand"><div id="standList"></div></div>
    </div>
  </section>

  <!-- LIST -->
  <section class="pane" id="pane-list">
    <div class="wrap">
      <div class="shead" id="lHead">询价清单</div>
      <div class="ssub" id="lSub"></div>
      <div id="listBox"></div>
      <div class="actions" id="listActions" hidden>
        <button class="btn pri" id="waBtn">WhatsApp</button>
        <button class="btn sec" id="copyBtn">复制文字</button>
        <button class="btn sec" id="csvBtn">下载 CSV</button>
        <button class="btn dgr" id="clearBtn">清空</button>
      </div>
    </div>
  </section>

  <!-- PAGES -->
  <section class="pane" id="pane-pages">
    <div class="wrap">
      <div class="shead" id="pHead">原版页面</div>
      <div class="ssub" id="pSub"></div>
      <div class="pgrid" id="pgrid"></div>
    </div>
  </section>

  <!-- SHARE -->
  <section class="pane" id="pane-share">
    <div class="wrap">
      <div class="shead" id="shHead"></div>
      <div class="ssub" id="shSub"></div>
      <div class="qrcard">
        <img id="qrImg" alt="">
        <div class="qrurl" id="qrUrl"></div>
      </div>
      <div class="sharebtns">
        <button class="sb-pri" id="shShareBtn"></button>
        <button class="sb-sec" id="shCopyBtn"></button>
      </div>
      <div class="installbox">
        <button class="installbtn" id="installBtn"></button>
        <div class="installed" id="installedMsg"></div>
      </div>
      <details class="diag" id="diag"><summary id="diagSum"></summary><ul id="diagList"></ul></details>
      <div class="howto" id="howto"></div>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="pane" id="pane-about">
    <div class="wrap"><div class="about" id="aboutBox"></div></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sgrab"><i></i><button class="sclose" id="sheetClose">×</button></div>
  <div class="sbody" id="sheetBody"></div>
</div>

<div class="viewer" id="viewer">
  <div class="vtop">
    <button id="vPrev">‹</button>
    <b id="vLabel"></b>
    <button id="vNext">›</button>
    <button id="vClose">✕</button>
  </div>
  <div class="vscroll" id="vScroll"></div>
</div>

<div class="toast" id="toast"></div>
<div class="update" id="updateBar" role="status">
  <span id="updateMsg"></span>
  <button id="updateBtn"></button>
</div>

let lang = store.get('baba.lang') || 'zh';
const t = () => T[lang];
const L = (o,k) => (lang==='zh' ? (o[k+'_zh']||o[k+'_en']) : (o[k+'_en']||o[k+'_zh'])) || '';
const ALT = (o,k) => (lang==='zh' ? (o[k+'_en']||'') : (o[k+'_zh']||''));

/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const el = (tag,cls,html) => { const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Each page image is registered once as a CSS custom property, so a card's
   style attribute stays a few bytes instead of carrying a 150 kB data URI. */
function thumb(p, extraStyle, overlay){
  /* Tiles are pre-rendered: product lifted off its catalogue panel and centred
     on flat grey. All of them live in one sprite, so this is pure positioning —
     no cropping maths, nothing from the page can leak in. */
  const {cols, rows} = DB.sprite;
  let st = `background-color:var(--field)`;
  if(p.tile >= 0){
    const cx = cols > 1 ? (p.tile % cols) / (cols - 1) * 100 : 0;
    const cy = rows > 1 ? Math.floor(p.tile / cols) / (rows - 1) * 100 : 0;
    st = `background-image:url('${SPRITE}');background-size:${cols * 100}% ${rows * 100}%;`+
         `background-position:${cx.toFixed(4)}% ${cy.toFixed(4)}%;background-repeat:no-repeat`;
  }
  if(extraStyle) st += ';' + extraStyle;
  return `<div class="thumb" style="${st}">${overlay || ''}</div>`;
}
function dotsHtml(keys, max){
  if(!keys||!keys.length) return '';
  const list = max ? keys.slice(0,max) : keys;
  return `<div class="dots">${list.map(k=>{
    const c = DB.colours[k]; if(!c) return '';
    return `<i class="dot" style="background:${c.hex}" title="${esc(lang==='zh'?c.zh:c.en)}"></i>`;
  }).join('')}</div>`;
}
let toastTimer;
function toast(msg){
  const n=$('#toast'); n.textContent=msg; n.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>n.classList.remove('on'),1900);
}

const TABS = ['browse','match','list','pages','share','about'];
const APP_URL = 'https://stanleywoosweeleong.github.io/Babagardening/';
let activeTab = 'browse';
function renderTabs(){
  const nav=$('#tabs'); nav.innerHTML='';
  TABS.forEach((id,i)=>{
    const b=el('button',null,t().tabs[i]);
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', id===activeTab);
    b.onclick=()=>setTab(id);
    nav.appendChild(b);
  });
}
function setTab(id){
  activeTab=id;
  TABS.forEach(x=>$('#pane-'+x).classList.toggle('on',x===id));
  renderTabs();
  window.scrollTo({top:0});
  if(id==='pages') renderPages();
  if(id==='list') renderList();
  if(id==='match') renderMatch();
  if(id==='share') renderShare();
  if(id==='about') renderAbout();
}

/* ============================ browse ============================ */
let cat = 'all', query = '';
function catCounts(){
  const m={}; DB.products.forEach(p=>m[p.cat]=(m[p.cat]||0)+1); return m;
}
function renderChips(){
  const box=$('#chips'); box.innerHTML=''; const counts=catCounts();
  const mk=(id,label,n)=>{
    const b=el('button','chip',`${esc(label)}<span class="n">${n}</span>`);
    b.setAttribute('aria-pressed', cat===id);
    b.onclick=()=>{cat=id; renderChips(); renderGrid();};
    box.appendChild(b);
  };
  mk('all', t().all, DB.products.length);
  DB.cats.forEach(c=> counts[c.id] && mk(c.id, lang==='zh'?c.zh:c.en, counts[c.id]));
}
function matches(p){
  if(cat!=='all' && p.cat!==cat) return false;
  if(!query) return true;
  return p._s.includes(query);
}
function renderGrid(){
  const g=$('#grid'); g.innerHTML='';
  const list = DB.products.filter(matches);
  $('#count').textContent = t().count(list.length);
  $('#empty').hidden = list.length>0;
  if(!list.length){
    $('#empty').innerHTML = `<b>${esc(t().noneT)}</b>${esc(t().noneD)}`;
    return;
  }
  const frag=document.createDocumentFragment();
  list.forEach(p=>{
    const c=el('button','pcard');
    c.innerHTML =
      thumb(p, '', p.flags.includes('new') ? `<span class="badge">NEW</span>` : '')+
      `<div class="pbody">`+
        `<div class="pname">${esc(L(p,'name'))}</div>`+
        `<div class="palt">${esc(ALT(p,'name'))}</div>`+
        (p.art?`<div class="pcode">${esc(p.art)}</div>`:
          (p.packs[0]&&p.packs[0].code?`<div class="pcode">${esc(p.packs[0].code)}</div>`:''))+
        dotsHtml(p.colours,6)+
      `</div>`;
    c.onclick=()=>openSheet(p.id);
    frag.appendChild(c);
  });
  g.appendChild(frag);
}

/* ============================ detail sheet ============================ */
let sheetHistory = [];
function openSheet(id, push=true){
  const p = DB.byId[id]; if(!p) return;
  if(push) sheetHistory.push(id);
  const b=$('#sheetBody');
  let h = `<div class="shero">
      ${thumb(p, "aspect-ratio:1/1")}
      <div style="flex:1;min-width:0">
        <div class="stitle">${esc(L(p,'name'))}</div>
        <div class="salt">${esc(ALT(p,'name'))}</div>
        ${L(p,'series')?`<span class="sser">${esc(L(p,'series'))}</span>`:''}
      </div>
    </div>`;

  if(L(p,'desc')) h += `<p class="sdesc">${esc(L(p,'desc'))}<small>${esc(ALT(p,'desc'))}</small></p>`;

  // spec strip
  if(p.dia || p.ht || p.saucer || p.spec_zh || p.spec_en){
    h += `<div class="lbl">${esc(t().specs)}</div><div class="strip">`;
    if(p.dia||p.ht||p.saucer){
      h += `<table><tr><th>${esc(t().artno)}</th>${p.dia?`<th>${esc(t().dia)}</th>`:''}`+
           `${p.ht?`<th>${esc(t().ht)}</th>`:''}${p.saucer?`<th>${esc(t().saucer)}</th>`:''}</tr>`+
           `<tr><td>${esc(p.art)}</td>${p.dia?`<td>${esc(p.dia)}</td>`:''}`+
           `${p.ht?`<td>${esc(p.ht)}</td>`:''}`+
           `${p.saucer?`<td><button class="slink" data-saucer="${esc(p.saucer)}">${esc(p.saucer)}</button></td>`:''}</tr></table>`;
      if(p.saucer && DB.saucerBy[p.saucer]){
        const s=DB.saucerBy[p.saucer];
        h += `<div style="font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-top:7px">`+
             `${esc(t().saucerDim)} ${esc(p.saucer)} · Ø${s.d} × ${s.h} mm</div>`;
      }
    } else {
      h += `<div style="font-family:var(--mono);font-size:12.5px">${esc(L(p,'spec'))}</div>`;
    }
    h += `</div>`;
  }

  if(p.packs.length){
    h += `<div class="lbl">${esc(t().packs)}</div><div class="packs">`;
    p.packs.forEach((pk,i)=>{
      const key=p.id+'|'+i;
      const inList = !!LIST[key];
      h += `<div class="pack">
        <span class="code">${esc(pk.code||'—')}</span>
        <span class="size">${esc(pk.size)}</span>
        <button class="add${inList?' in':''}" data-add="${esc(key)}">${esc(inList?t().added:t().add)}</button>
      </div>`;
    });
    h += `</div>`;
  }

  if(p.colours && p.colours.length){
    h += `<div class="lbl">${esc(t().colours)}</div><div class="swatches">`;
    p.colours.forEach(k=>{ const c=DB.colours[k]; if(!c) return;
      h += `<span class="sw"><i style="background:${c.hex}"></i>${esc(lang==='zh'?c.zh:c.en)}</span>`; });
    h += `</div>`;
  }

  const stands = DB.potStands[p.art];
  if(stands && stands.length){
    h += `<div class="lbl">${esc(lang==='zh'?'可配铁架':'Fits iron stands')}</div><div class="reflist">`;
    stands.forEach(s=>{ h += `<button class="ref hit" data-open="${esc(DB.standIdBy[s])}">${esc(s)}</button>`; });
    h += `</div>`;
  }

  if(p.cat==='stand' && p.fits){
    h += `<div class="lbl">${esc(t().fitPots)}</div><div class="reflist">`;
    p.fits.forEach(f=>{
      h += f.id ? `<button class="ref hit" data-open="${esc(f.id)}">${esc(f.as)}</button>`
                : `<span class="ref miss">${esc(f.as)} · ${esc(t().notFound)}</span>`;
    });
    h += `</div>`;
  }

  if(p.note) h += `<div class="note"><b>⚠ ${esc(t().warn)}</b>${esc(lang==='zh'?p.note.zh:p.note.en)}</div>`;

  h += `<button class="pagebtn" data-page="${p.page}">${esc(t().viewPage(p.page))}</button>`;
  b.innerHTML=h;
  b.scrollTop=0; $('#sheet').scrollTop=0;

  b.querySelectorAll('[data-add]').forEach(n=>n.onclick=()=>{ addToList(n.dataset.add); openSheet(id,false); });
  b.querySelectorAll('[data-open]').forEach(n=>n.onclick=()=>openSheet(n.dataset.open));
  b.querySelectorAll('[data-page]').forEach(n=>n.onclick=()=>{ closeSheet(); openViewer(+n.dataset.page-1); });
  b.querySelectorAll('[data-saucer]').forEach(n=>n.onclick=()=>{
    const sid = DB.saucerIdBy[n.dataset.saucer]; if(sid) openSheet(sid);
  });

  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeSheet(){
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on');
  document.body.style.overflow=''; sheetHistory=[];
}
$('#scrim').onclick=closeSheet; $('#sheetClose').onclick=closeSheet;

function renderPotTable(){
  const dmin=+($('#fDiaMin').value||0), dmax=+($('#fDiaMax').value||99999), hmax=+($('#fHtMax').value||99999);
  const rows = DB.products.filter(p=>p.cat==='pot').filter(p=>{
    const d=parseInt(p.dia,10), h=parseInt(p.ht,10);
    if(isNaN(d)) return dmin<=0;
    return d>=dmin && d<=dmax && (isNaN(h)||h<=hmax);
  });
  let h=`<tr><th>${esc(t().artno)}</th><th>${esc(t().dia)}</th><th>${esc(t().ht)}</th><th>${esc(t().saucer)}</th><th>${esc(t().saucerDim)}</th></tr>`;
  rows.forEach(p=>{
    const s = p.saucer ? DB.saucerBy[p.saucer] : null;
    h+=`<tr data-open="${esc(p.id)}"><td class="m">${esc(p.art)}</td><td class="m">${esc(p.dia||'—')}</td>`+
       `<td class="m">${esc(p.ht||'—')}</td><td class="m">${esc(p.saucer||'—')}</td>`+
       `<td class="m">${s?`Ø${s.d} × ${s.h}`:`<span style="opacity:.5">${esc(t().noSaucer)}</span>`}</td></tr>`;
  });
  const tb=$('#potTable'); tb.innerHTML=h;
  tb.querySelectorAll('[data-open]').forEach(n=>n.onclick=()=>openSheet(n.dataset.open));
}
['fDiaMin','fDiaMax','fHtMax'].forEach(id=>{ const n=$('#'+id); n && (n.oninput=renderPotTable); });

let LIST = {};
try{ LIST = JSON.parse(store.get('baba.list')||'{}'); }catch(e){ LIST={}; }
const saveList = () => store.set('baba.list', JSON.stringify(LIST));
function addToList(key){
  LIST[key] = (LIST[key]||0)+1; saveList();
  const [pid,i]=key.split('|'); const p=DB.byId[pid];
  toast(`${L(p,'name')} · ${p.packs[+i].size} ×${LIST[key]}`);
}
function renderList(){
  $('#lHead').textContent=t().lHead; $('#lSub').textContent=t().lSub;
  const box=$('#listBox'); box.innerHTML='';
  const keys=Object.keys(LIST).filter(k=>LIST[k]>0);
  $('#listActions').hidden = !keys.length;
  if(!keys.length){
    box.innerHTML=`<div class="empty"><b>${esc(t().listEmptyT)}</b>${esc(t().listEmptyD)}</div>`;
    return;
  }
  keys.forEach(k=>{
    const [pid,i]=k.split('|'); const p=DB.byId[pid]; if(!p) return;
    const pk=p.packs[+i]; if(!pk) return;
    const row=el('div','litem');
    row.innerHTML=thumb(p)+
      `<div class="linfo"><b>${esc(L(p,'name'))}</b><span>${esc(pk.code||'—')} · ${esc(pk.size)}</span></div>`+
      `<div class="qty"><button data-d="-1">−</button><input type="text" inputmode="numeric" value="${LIST[k]}"><button data-d="1">+</button></div>`;
    row.querySelector('[data-d="-1"]').onclick=()=>{ LIST[k]--; if(LIST[k]<=0) delete LIST[k]; saveList(); renderList(); };
    row.querySelector('[data-d="1"]').onclick=()=>{ LIST[k]++; saveList(); renderList(); };
    row.querySelector('input').onchange=e=>{
      const v=parseInt(e.target.value,10);
      if(!v||v<=0) delete LIST[k]; else LIST[k]=v;
      saveList(); renderList();
    };
    box.appendChild(row);
  });
  $('#waBtn').textContent=t().wa; $('#copyBtn').textContent=t().copy;
  $('#csvBtn').textContent=t().csv; $('#clearBtn').textContent=t().clear;
}
function listText(){
  const lines=[t().qtyTitle, `Baba Catalogue 2026 (REV/MAY)`, ''];
  Object.keys(LIST).forEach(k=>{
    const [pid,i]=k.split('|'); const p=DB.byId[pid]; if(!p) return;
    const pk=p.packs[+i]; if(!pk) return;
    lines.push(`• ${pk.code?pk.code+' — ':''}${L(p,'name')} (${ALT(p,'name')}) · ${pk.size} × ${LIST[k]}`);
  });
  return lines.join('\n');
}
$('#waBtn').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(listText()),'_blank');
$('#copyBtn').onclick=async()=>{
  const txt=listText();
  try{ await navigator.clipboard.writeText(txt); toast(t().copied); }
  catch(e){
    const ta=el('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); toast(t().copied);
  }
};
$('#csvBtn').onclick=()=>{
  const rows=[['Art No.','Name (ZH)','Name (EN)','Pack','Qty','Category','Page']];
  Object.keys(LIST).forEach(k=>{
    const [pid,i]=k.split('|'); const p=DB.byId[pid]; if(!p) return;
    const pk=p.packs[+i]; if(!pk) return;
    rows.push([pk.code||p.art||'', p.name_zh||'', p.name_en||'', pk.size, LIST[k], p.cat, p.page]);
  });
  const csv='\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=el('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='baba-enquiry-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
};
$('#clearBtn').onclick=()=>{ if(confirm(t().confirmClear)){ LIST={}; saveList(); renderList(); toast(t().cleared); } };

/* ============================ pages ============================ */
function renderPages(){
  $('#pHead').textContent=t().pHead; $('#pSub').textContent=t().pSub;
  const g=$('#pgrid'); if(g.dataset.done) return;
  PAGES.forEach((src,i)=>{
    const b=el('button','pgt');
    b.innerHTML=`<img src="${src}" alt="${esc(t().page(i+1))}" loading="lazy"><span>${esc(t().page(i+1))}</span>`;
    b.onclick=()=>openViewer(i);
    g.appendChild(b);
  });
  g.dataset.done='1';
}
let vIndex=0;
function openViewer(i){
  vIndex=Math.max(0,Math.min(PAGES.length-1,i));
  $('#vLabel').textContent=t().page(vIndex+1)+' / '+PAGES.length;
  $('#vScroll').innerHTML=`<img src="${PAGES[vIndex]}" alt="">`;
  $('#vScroll').scrollTop=0;
  $('#viewer').classList.add('on'); document.body.style.overflow='hidden';
}
$('#vClose').onclick=()=>{ $('#viewer').classList.remove('on'); document.body.style.overflow=''; };
$('#vPrev').onclick=()=>openViewer(vIndex-1);
$('#vNext').onclick=()=>openViewer(vIndex+1);

/* ============================ share ============================ */
function renderShare(){
  $('#shHead').textContent = t().shHead;
  $('#shSub').textContent  = t().shSub;
  const img = $('#qrImg');
  if(img.getAttribute('src') !== QR) img.src = QR;
  img.alt = t().shHead;
  $('#qrUrl').textContent = APP_URL;
  paintInstall();
  $('#shShareBtn').textContent = t().shShare;
  $('#shCopyBtn').textContent  = t().shCopy;

  const blocks = [
    [t().shAndroid, t().shAndroidSteps, ''],
    [t().shIos,     t().shIosSteps,     t().shIosWarn],
    [t().shDesktop, t().shDesktopSteps, '']
  ];
  $('#howto').innerHTML = `<div class="lbl" style="margin-top:0">${esc(t().shInstall)}</div>` +
    blocks.map(([title, steps, warn]) => `<div class="how"><h4>${esc(title)}</h4><ol>` +
      steps.map(s=>`<li>${esc(s)}</li>`).join('') + `</ol>` +
      (warn?`<span class="warn">${esc(warn)}</span>`:'') + `</div>`).join('');
}
function shareText(){ return t().shMsg + '\n' + APP_URL; }

/* ---- install: Chrome/Edge fire beforeinstallprompt when the app qualifies.
   Desktop Chrome shows no banner of its own, only a small address-bar icon,
   so we surface an explicit button instead. ---- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  paintInstall();
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  paintInstall();
  toast(t().instOk);
});
let SW_STATE = 'unknown';
function refreshSwState(){
  if(!('serviceWorker' in navigator)){ SW_STATE = 'none'; paintDiag(); return; }
  navigator.serviceWorker.getRegistration().then(reg => {
    SW_STATE = !reg ? 'none'
      : (navigator.serviceWorker.controller ? 'active' : 'registered');
    paintDiag();
  }).catch(() => { SW_STATE = 'none'; paintDiag(); });
}
function isStandalone(){
  /* matchMedia is missing in a few embedded webviews — never let this throw. */
  try{
    if(typeof window.matchMedia === 'function' &&
       window.matchMedia('(display-mode: standalone)').matches) return true;
  }catch(e){}
  return window.navigator.standalone === true;
}
function paintInstall(){
  const btn = $('#installBtn'), done = $('#installedMsg');
  if(!btn) return;
  btn.textContent = t().instBtn;
  done.textContent = t().instDone;
  const installed = isStandalone();
  btn.classList.toggle('on', !!deferredPrompt && !installed);
  done.classList.toggle('on', installed);
  paintDiag();
}
function paintDiag(){
  const list = $('#diagList'); if(!list) return;
  $('#diagSum').textContent = t().diagSum;
  const swOk = SW_STATE === 'active' || SW_STATE === 'registered';
  const swLabel = t().dSw + (SW_STATE === 'registered' ? ' ' + t().dSwBypassed : '');
  // 'i' rows are informational — they describe the situation, not a fault
  const checks = [
    ['y/n', location.protocol === 'https:' || location.hostname === 'localhost', t().dHttps],
    ['y/n', !!document.querySelector('link[rel="manifest"]'), t().dManifest],
    ['y/n', swOk, swLabel],
    ['y/n', document.querySelectorAll('link[rel="apple-touch-icon"],link[rel="icon"]').length >= 2, t().dIcons],
    ['i', isStandalone(), isStandalone() ? t().dStandaloneYes : t().dStandaloneNo]
  ];
  list.innerHTML = checks.map(([kind, ok, label]) => {
    const cls = kind === 'i' ? 'i' : (ok ? 'y' : 'n');
    const mark = kind === 'i' ? '·' : (ok ? '✓' : '✕');
    return `<li class="${cls}"><i>${mark}</i><span>${esc(label)}</span></li>`;
  }).join('') + `<li class="hint"><span>${esc(t().dHint)}</span></li>`;
}
$('#installBtn').onclick = async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  try{ await deferredPrompt.userChoice; }catch(e){}
  deferredPrompt = null;
  paintInstall();
};
async function copyLink(){
  try{ await navigator.clipboard.writeText(APP_URL); }
  catch(e){
    const ta=el('textarea'); ta.value=APP_URL; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(t().shCopied);
}
$('#shCopyBtn').onclick = copyLink;
$('#shShareBtn').onclick = async () => {
  if(navigator.share){
    try{ await navigator.share({title:'Baba 2026', text:t().shMsg, url:APP_URL}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  window.open('https://wa.me/?text='+encodeURIComponent(shareText()), '_blank');
};

/* ============================ language ============================ */
function applyLang(){
  document.documentElement.lang = lang==='zh'?'zh':'en';
  $('#langBtn').textContent = lang==='zh'?'EN':'中文';
  $('#hTitle').textContent = t().title;
  $('#q').placeholder = t().search;
  renderTabs(); renderChips(); renderGrid();
  if(activeTab==='match') renderMatch();
  if(activeTab==='list') renderList();
  if(activeTab==='share') renderShare();
  if(activeTab==='about') renderAbout();
  if(activeTab==='pages'){ $('#pHead').textContent=t().pHead; $('#pSub').textContent=t().pSub; }
}
$('#langBtn').onclick=()=>{ lang = lang==='zh'?'en':'zh'; store.set('baba.lang',lang); applyLang(); };

/* ---- reader text size: 3 steps, scales the whole rem-based type scale ---- */
const STEPS = [
  {pct:'100%', zh:'标准', en:'Standard'},
  {pct:'115%', zh:'大字', en:'Large'},
  {pct:'132%', zh:'特大', en:'Largest'}
];
let sizeStep = parseInt(store.get('baba.size')||'0',10) || 0;
function applySize(){
  document.documentElement.style.fontSize = STEPS[sizeStep].pct;
  const s = STEPS[sizeStep];
  $('#sizeBtn').innerHTML = sizeStep===0 ? 'A<sup>+</sup>' : (sizeStep===1 ? 'A<sup>++</sup>' : 'A');
  $('#sizeBtn').setAttribute('aria-label', (lang==='zh'?'字体大小：':'Text size: ')+(lang==='zh'?s.zh:s.en));
}
$('#sizeBtn').onclick=()=>{
  sizeStep = (sizeStep+1) % STEPS.length;
  store.set('baba.size', String(sizeStep));
  applySize();
  toast((lang==='zh'?'字体：':'Text: ')+(lang==='zh'?STEPS[sizeStep].zh:STEPS[sizeStep].en));
};

/* ============================ search ============================ */
$('#q').oninput=e=>{
  query = e.target.value.trim().toLowerCase();
  $('#qClear').hidden = !query;
  renderGrid();
};
$('#qClear').onclick=()=>{ $('#q').value=''; query=''; $('#qClear').hidden=true; renderGrid(); };

document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if($('#viewer').classList.contains('on')) $('#vClose').click();
  else if($('#sheet').classList.contains('on')) closeSheet();
});

/* ============================ boot ============================ */
DB.byId={}; DB.saucerBy={}; DB.saucerIdBy={}; DB.standIdBy={};
DB.products.forEach(p=>{
  DB.byId[p.id]=p;
  p._s = [p.name_zh,p.name_en,p.series_zh,p.series_en,p.desc_zh,p.desc_en,p.art,
          p.spec_zh,p.spec_en, ...p.packs.map(k=>k.code+' '+k.size)].join(' ').toLowerCase();
  if(p.cat==='saucer'){ DB.saucerIdBy[p.art]=p.id; }
  if(p.cat==='stand'){ DB.standIdBy[p.art]=p.id; }
});
DB.saucers.forEach(s=>DB.saucerBy[s.code]=s);
$('#brandMark').src = LOGO;
applyLang();
applySize();
refreshSwState();

/* Deep links from the manifest shortcuts: ?tab=list / ?tab=match */
const wantTab = new URLSearchParams(location.search).get('tab');
setTab(TABS.includes(wantTab) ? wantTab : 'browse');

/* ---------------------------------------------------------------
   Service worker. Only over http(s) — from file:// there is no SW,
   and the single-file build already works offline there.
   --------------------------------------------------------------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './' }).then(reg => {
      if (!navigator.serviceWorker.controller) {
        // First run: the precache is filling now.
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          sw && sw.addEventListener('statechange', () => {
            if (sw.state === 'activated') toast(t().offlineReady);
          });
        });
      }
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) showUpdate(reg);
        });
      });
      if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg);
      refreshSwState();
    }).catch(e => console.warn('SW registration failed:', e.message));

    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
  });
}
function showUpdate(reg){
  const bar = $('#updateBar');
  $('#updateMsg').textContent = t().updMsg;
  $('#updateBtn').textContent = t().updBtn;
  bar.classList.add('on');
  $('#updateBtn').onclick = () => {
    bar.classList.remove('on');
    if (reg.waiting) reg.waiting.postMessage('skipWaiting');
    else location.reload();
  };
}
</script>
